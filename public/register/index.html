<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your account · iniSHial</title>
<link rel="stylesheet" href="/app.css">
<script src="/ui.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to the page</a>
<header class="site"><nav aria-label="Main">
  <a class="brand" href="/">ini<span class="sh">SH</span>ial</a>
  <ul class="nav-main">
    <li><a href="/">Start</a></li>
    <li><a href="/register/">Set up my account</a></li>
    <li><a href="/sign/">Read &amp; initial</a></li>
  </ul>
  <div class="nav-end">
    <button type="button" class="theme-toggle"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.2v2.1M12 19.7v2.1M4.6 4.6l1.5 1.5M17.9 17.9l1.5 1.5M2.2 12h2.1M19.7 12h2.1M4.6 19.4l1.5-1.5M17.9 6.1l1.5-1.5"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.8A8.8 8.8 0 0 1 9.2 3.5a8.8 8.8 0 1 0 11.3 11.3Z"/></svg></button>
    <a href="/admin/login/">Teacher sign-in</a>
  </div>
</nav></header>

<main id="main" tabindex="-1">
  <h1>Set up your account</h1>
  <p class="muted">Already set one up? Enter your student ID and last name and leave the rest blank —
    it takes you back to your syllabus.</p>

  <form id="form" class="card" novalidate>
    <label for="sid">Student ID number
      <span class="hint">The number on your school ID card.</span></label>
    <input id="sid" name="student_ext_id" type="text" inputmode="numeric" autocomplete="off" required>

    <label for="last">Last name</label>
    <input id="last" name="last" type="text" autocomplete="family-name" required>

    <label for="username">Pick a username <span class="hint">— first time only</span>
      <span class="hint">3–32 characters. Letters, numbers, dot, dash, underscore.
        Leave blank if you already have an account.</span></label>
    <input id="username" name="username" type="text" autocomplete="off">

    <label for="email">Parent or guardian's email <span class="hint">— optional</span>
      <span class="hint">Your school already has a contact email for most families. Only fill this in if
        your parent or guardian should get the syllabus at a different address.</span></label>
    <input id="email" name="parent_email" type="email" autocomplete="off">

    <div id="msg" hidden></div>
    <p><button id="submit" type="submit">Continue</button></p>
  </form>

  <div id="done" class="card" hidden>
    <h2 id="doneTitle">You're registered</h2>
    <p id="doneWho" class="muted"></p>
    <p id="doneMsg"></p>
    <p><a id="doneNext" class="button" href="/sign/">Read and initial the syllabus</a></p>
  </div>
</main>

<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const submit = document.getElementById('submit');

function show(text, kind) {
  msg.hidden = false;
  msg.className = 'notice ' + kind;
  msg.textContent = text;
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  msg.hidden = true;
  submit.disabled = true;
  submit.textContent = 'Checking…';

  const payload = Object.fromEntries(new FormData(form).entries());

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const body = await res.json();

    if (!res.ok) {
      show(body.error || 'Something went wrong. Try again.', 'error');
      return;
    }

    document.getElementById('doneWho').textContent =
      [body.student, body.course, body.period && ('Period ' + body.period)].filter(Boolean).join(' · ');
    document.getElementById('doneTitle').textContent = body.returning ? 'Welcome back' : "You're registered";
    document.getElementById('doneMsg').textContent = body.message;
    const next = document.getElementById('doneNext');
    next.href = body.next || '/sign/';
    next.textContent = body.returning ? 'Back to the syllabus' : 'Read and initial the syllabus';
    form.hidden = true;
    document.getElementById('done').hidden = false;
  } catch {
    show('Could not reach the server. Check your connection and try again.', 'error');
  } finally {
    submit.disabled = false;
    submit.textContent = 'Continue';
  }
});
</script>
</body>
</html>
