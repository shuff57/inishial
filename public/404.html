<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · iniSHial</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- The stored theme, applied before the first paint. Inline and tiny on
     purpose: a blocking <script src> here cost ~88ms of first paint, and a
     cross-document view transition cannot start until the new page paints,
     so that delay was visible as a pause-then-flash on every page turn. -->
<script>try{var t=localStorage.getItem("inishial:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="/ui.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to the page</a>
<header class="site"><nav aria-label="Main">
  <a class="brand" href="/">ini<span class="sh">SH</span>ial</a>
  <ul class="nav-main">
    <li><a href="/">Start</a></li>
    <li><a href="/register/">Set up my account</a></li>
    <li><a href="/sign/">Read &amp; initial</a></li>
  </ul>
  <div class="nav-end">
    <button type="button" class="theme-toggle"><svg class="sun icon" aria-hidden="true"><use href="/icons.svg#i-sun"/></svg><svg class="moon icon" aria-hidden="true"><use href="/icons.svg#i-moon"/></svg></button>
    <a href="/admin/login/">Teacher sign-in</a>
  </div>
</nav></header>

<main id="main" tabindex="-1">
  <h1>That page isn't here</h1>
  <p class="muted">The link may be mistyped, or the page may have moved.</p>
  <p class="note-hand">Check the link your teacher sent you.</p>
  <p><a href="/">Back to the start</a></p>
</main>
</body>
</html>
<!--
  This file exists to stop Cloudflare Pages falling back to index.html for
  unmatched paths. Without it an unknown route -- including a mistyped API
  path -- returns the landing page with HTTP 200, which reads as success to
  anything calling the API.
-->
