<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to use · iniSHial</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- The stored theme, applied before the first paint. Inline and tiny on
     purpose: a blocking <script src> here costs first paint for no reason. -->
<script>try{var t=localStorage.getItem("inishial:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="/ui.js" defer></script>
<!--
  Three audiences, one page. The steps are NOT in this file: each one is
  written by the recorder that produced its clip (scripts/record/*.mjs) into
  public/how/steps/*.json, so rewording a step or re-recording a clip never
  touches markup, and a step can never name a video that was not made -- the
  recorder checks that on disk before it writes the manifest.
-->
<style>
  /* Wider than the reading pages. Two columns of a third and two thirds only
     works if the narrow one still holds a readable measure -- at 52rem the
     step text came out around 35 characters a line, which is a column of
     wreckage rather than prose. */
  main { max-width: 68rem; }

  /* The step: what to do on the left, what it looks like on the right.
   *
   * Both columns are whole numbers of rules on their own, so the row is too,
   * whichever of them is taller -- which is what lets the ruled paper survive
   * a layout where the two halves are never the same height. row-gap stays 0
   * for the same reason it does on the tab strip: a fractional gap between
   * rows walks everything below it off the lines. The separation comes from
   * the next heading's own margin, which is already a rule. */
  .step {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
    column-gap: 1.6rem;
    row-gap: 0;
    /* NOT align-items: center. Centring in CSS splits the leftover height in
       half, and half of an odd number of rules is 16px -- which puts the step
       text exactly between two ruled lines for the rest of the page. The text
       is centred by sizeClips() instead, which rounds the offset to a whole
       rule before applying it. */
    align-items: start;
  }

  /* The gap under a clip is the next heading's own margin and nothing else.
     A margin here as well stacked with it into two blank ruled lines, which
     read as a tall band separating nothing from nothing. */
  .say > p:last-child { margin-bottom: 0; }

  /* One column once there is no room for two, in reading order: number,
     instruction, then the recording of it.
     The clip was hoisted above the text here at first, on the theory that the
     recording is what a phone reader wants. On a real 390px screen that put an
     unlabelled video directly under the section blurb, with the step it
     belongs to only appearing underneath it -- you had to watch something
     before being told what it was. Two lines of text is a cheap enough scroll
     to be worth the caption. */
  @media (max-width: 62rem) {
    .step { grid-template-columns: minmax(0, 1fr); }
  }

  /* The clip.
   *
   * A video is a filled box, so it obeys the same rule as the banners and the
   * drop zone: 26px of padding above and 6px below puts its top and bottom
   * edges on DRAWN rules rather than 6px under them, and costs exactly one
   * rule of the grid. The video's own height is set in whole rules by
   * sizeClips() below, which is what keeps the arithmetic true. */
  .clip {
    margin: 0;
    padding: calc(var(--baseline) + var(--sit)) 0 var(--lift);
  }
  /* The mount is the box; the video floats inside it. Separating the two is
     what leaves somewhere for the doodle to live -- an opaque <video> painted
     its own sand background over anything behind it. */
  .clip .mount {
    position: relative;
    height: calc(var(--rule) * var(--clip-rules, 13));
    background: var(--sand);
    border-radius: var(--radius-md);
    overflow: hidden;
    /* A ring rather than a border: a 1px border is 2px of height, and 2px is
       all it takes to walk every line below this off the paper. box-shadow
       does not participate in layout. */
    box-shadow: 0 0 0 1px var(--border-warm);
  }
  .clip video {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: transparent;
    transition: opacity 220ms ease-out;
  }
  /* Hidden until there is a frame. A <video> with controls paints its OWN dark
     loading state and a spinner, which sat on top of the doodle and defeated
     the whole point -- and a control bar under an empty box is furniture for
     something that is not there yet. */
  .mount:not(.ready) video { opacity: 0; }

  /* Something to watch while the clip arrives.
   *
   * A browser's own spinner is a piece of chrome from a different application
   * sitting in the middle of a sheet of ruled paper. This is a line being
   * drawn and rubbed out, which is what the rest of the page is made of.
   *
   * pathLength="1" normalises the path so the dash maths is 1 -> 0 -> -1 and
   * does not have to be re-measured if the squiggle is ever redrawn. */
  .doodle {
    position: absolute; inset: 0; margin: auto;
    width: 8rem; height: 2.4rem;
    color: var(--ink-silver);
    transition: opacity 200ms ease-out;
  }
  .doodle path {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: scribble 2.1s ease-in-out infinite;
  }
  @keyframes scribble {
    0%   { stroke-dashoffset: 1; }
    50%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -1; }
  }
  /* Once there are frames to show, the doodle has done its job. Kept in the
     DOM rather than removed so a theme swap can bring it straight back. */
  .mount.ready .doodle { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .doodle path { animation: none; stroke-dashoffset: 0; }
  }

  /* Steps are numbered by the manifest, not by an <ol> -- the number is part of
     the heading line so it sits on a rule with the title rather than in a
     gutter the ruled paper knows nothing about. */
  .steps { list-style: none; margin: 0; padding: 0; }
  .step h3 { margin: var(--rule) 0 0; }
  /* vertical-align is the whole point of this rule, not a detail.
   *
   * An inline-block is aligned by ITS baseline against the line's, and a
   * 13.6px mono digit's baseline does not sit where a 16.8px display serif's
   * does. Reconciling the two made every <h3> 33px instead of 32 -- one pixel
   * per step, accumulating, so by step four the paper was off by four and by
   * the end of the teacher list it was off by twenty. `top` takes the box out
   * of baseline alignment entirely and the line stays exactly one rule. */
  .step .n {
    display: inline-block;
    width: 1.7rem;
    vertical-align: top;
    line-height: var(--rule);
    color: var(--ink-silver);
    font-family: var(--font-mono);
    font-size: .85rem;
  }
  .step p { margin: 0 0 var(--rule); }

  /* A step with no recording. Not a failure state -- some of what a teacher can
     do needs an AI model configured, and describing it beats faking it. */
  .step .instead {
    padding: calc(var(--baseline) + var(--sit)) .9rem var(--lift);
    color: var(--ink-stone);
    font-size: .875rem;
    line-height: var(--rule);
    border-left: 2px solid var(--border-warm);
  }

  /* Three strips of tape stuck to the page, one per reader.
   *
   * The class is `.roles` and NOT `.tabs`, and that is the whole trick. `.tabs`
   * sits on app.css's tape opt-out list -- as does `.compact`, which these
   * buttons also used to carry -- so as a tab strip they were opted out twice
   * over, and no styling here would have brought the strip back without a
   * specificity fight against a rule that is right to exist. Not matching the
   * opt-out at all is cheaper and truer than out-ranking it.
   *
   * Dropping `.compact` also makes them two rules tall, which is the height the
   * torn clip-path was drawn for. On a one-rule chip the same tear reads as a
   * serrated edge rather than something ripped off a roll.
   *
   * The opt-out list is for furniture -- rails, chips, block tools. These are
   * the only navigation on the page and the first thing a reader touches, so
   * they are actions in the reading flow, which is the line app.css draws.
   *
   * No row-gap: .row carries .6rem on both axes, and on a phone these wrap to
   * two lines, which added 9.6px and walked the whole page off the paper. Each
   * is a whole number of rules, so stacked rows land on consecutive lines. */
  .roles { row-gap: 0; }
  .roles button { color: var(--ink-stone); }
  .roles button:hover:not([disabled]) { color: var(--ink); }

  /* Lay the strip BETWEEN two ruled lines instead of across them.
   *
   * A two-rule button spans exactly from one drawn line to the next but one,
   * so an opaque fill covers the line at its top edge and the line at its
   * bottom edge. On a button sitting in a paragraph nobody notices; on three
   * strips alone in a band of white space it reads as two missing lines and a
   * hole in the paper.
   *
   * 4px in from top and bottom leaves both lines drawn and untouched, and the
   * one running underneath still ghosts through the 94% fill. It also looks
   * more like tape: a strip pressed onto a page lands between the lines, not
   * measured onto them. The box does not move, so the grid is untouched.
   *
   * `:not(.danger)` is here for specificity and nothing else. Without it the
   * selector is (0,1,3) and the tape's own `inset: 0` at (0,2,2) wins -- one
   * class outranks any number of elements. */
  main .roles button:not(.danger)::before { inset: 4px 0; }

  /* The one you are reading keeps the marker band swiped across it for good.
     That band is already how the whole site says "this one" -- prose links,
     .mark, and every tape button on hover -- so a selected tab is not a new
     idea, just that same gesture held down. */
  main .roles button.on { color: var(--ink); font-weight: 600; }
  main .roles button.on::after { transform: scaleX(1) rotate(-.5deg); }

  /* One blank ruled line between the tape strip and the first heading, not two.
     A two-rule button's bottom edge lands exactly ON a drawn rule and covers
     it, so the default two rules of air above an <h2> read as a missing line
     followed by a gap twice the size of every other gap on the page. Only the
     FIRST heading in a panel: the teacher tab holds two sections, and the
     second one still wants its full separation. */
  .panel > h2:first-child { margin-top: var(--rule); }

  .panel[hidden] { display: none; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the page</a>
<header class="site"><nav aria-label="Main">
  <a class="brand" href="/">ini<span class="sh">SH</span>ial</a>
  <ul class="nav-main">
    <li><a class="to-icon" href="/" title="Start"><svg class="icon only" aria-hidden="true"><use href="/icons.svg#i-home"/></svg><span class="label">Start</span></a></li>

    <li><a class="to-icon" href="/how/" title="How to use"><svg class="icon only" aria-hidden="true"><use href="/icons.svg#i-guide"/></svg><span class="label">How to use</span></a></li>
    <li><a class="to-icon" href="/register/" title="Set up my account"><svg class="icon only" aria-hidden="true"><use href="/icons.svg#i-person"/></svg><span class="label">Set up my account</span></a></li>

    <a class="to-icon" href="/admin/login/" title="Teacher sign-in"><svg class="icon only" aria-hidden="true"><use href="/icons.svg#i-signin"/></svg><span class="label">Teacher sign-in</span></a>
  </div>
</nav></header>

<main id="main" tabindex="-1">
  <h1>How to use iniSHial</h1>
  <p class="muted">Every step below has a short recording of the real thing. Nothing
    plays on its own, press play on the one you need.</p>

  <div class="roles row" role="tablist" aria-label="Who you are">
    <button type="button" role="tab" id="tab-student" aria-controls="panel-student" data-tab="student">I'm a student</button>
    <button type="button" role="tab" id="tab-parent" aria-controls="panel-parent" data-tab="parent">I'm a parent</button>
    <button type="button" role="tab" id="tab-teacher" aria-controls="panel-teacher" data-tab="teacher">I'm a teacher</button>
  </div>

  <div id="msg" hidden></div>

  <section class="panel" id="panel-student" role="tabpanel" aria-labelledby="tab-student" tabindex="-1" hidden></section>
  <section class="panel" id="panel-parent" role="tabpanel" aria-labelledby="tab-parent" tabindex="-1" hidden></section>
  <section class="panel" id="panel-teacher" role="tabpanel" aria-labelledby="tab-teacher" tabindex="-1" hidden></section>

  <noscript>
    <p class="notice error">This page needs JavaScript. The steps and their recordings are
      loaded from a manifest so that rewording one never means editing this page.</p>
  </noscript>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// A tab can hold more than one manifest. The teacher path is recorded in two
// halves -- building a syllabus, and running the class -- because they are
// separate jobs done at separate times, and one twenty-step list reads as a
// wall rather than as two short ones.
const TABS = {
  student: ['student'],
  parent: ['parent'],
  teacher: ['teacher-setup', 'teacher-manage'],
};

/**
 * One pen stroke, looping along a line, the way you doodle in a margin while
 * waiting for something.
 *
 * Nine identical cubics. Each one is a loop rather than a wave because the
 * control points overshoot in BOTH directions: the first reaches well past
 * where the segment ends (30 against a pitch of 13) and the second doubles
 * back behind where it started (-18), so the curve crosses itself on the way
 * round. Narrow that overshoot and the loop collapses into a spike -- the
 * first attempt used 14 and -2 against a pitch of 12 and drew a zigzag.
 *
 * pathLength="1" normalises the stroke so the dash animation is 1 -> 0 -> -1
 * and never has to be re-measured if the squiggle is redrawn.
 */
const DOODLE = `<svg class="doodle" viewBox="0 0 145 44" aria-hidden="true"
  fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
  <path pathLength="1" d="M8 34${' c30,-26 -18,-26 13,0'.repeat(9)}"/>
</svg>`;

function stepHtml(s) {
  // Both sources ride on the element; theme() picks one. A step with no dark
  // variant recorded keeps showing its light clip rather than 404ing, which is
  // what makes recording the two themes independent of each other.
  const media = s.clip
    ? `<figure class="clip"><div class="mount">${DOODLE}<video
         controls muted loop playsinline preload="metadata"
         aria-label="${esc(s.title)}"
         data-light="/how/media/${esc(s.clip)}"
         data-dark="/how/media/${esc(s.clipDark || s.clip)}"></video></div></figure>`
    : (s.note ? `<p class="instead">${esc(s.note)}</p>` : '');
  // No enlarge control. The video's own controls already carry a fullscreen
  // button, and a second way to do the same thing was just a button taking up
  // a rule of the page.
  return `<li class="step">
      <div class="say">
        <h3><span class="n">${s.n}</span>${esc(s.title)}</h3>
        <p class="muted">${esc(s.body)}</p>
      </div>
      ${media}
    </li>`;
}

const sectionHtml = (m) => `<h2>${esc(m.title)}</h2>
  <p class="muted">${esc(m.blurb)}</p>
  <ul class="steps">${m.steps.map(stepHtml).join('')}</ul>`;

/**
 * A video is the one box on the page whose height cannot be written down in
 * advance: it has to be a whole number of rules AND match the 16:10 the clips
 * were recorded at, and the second depends on how wide the window is.
 *
 * So it is measured. Rounding the ideal height to the nearest rule leaves at
 * most half a rule of letterboxing -- invisible against the mount -- and keeps
 * every line below the clip on the paper, which a raw aspect-ratio would not.
 */
/** Light or dark, the way the rest of the site decides it: an explicit choice
 *  on <html> if the reader has made one, the OS preference otherwise. */
const theme = () => {
  const set = document.documentElement.getAttribute('data-theme');
  return set === 'light' || set === 'dark'
    ? set
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
};

/**
 * Point every clip at the recording for the current theme.
 *
 * A screen recording is a picture of the app, so a light-mode recording sitting
 * on a dark page is a bright rectangle in the middle of the sheet -- the one
 * element that did not follow the toggle.
 *
 * Position and paused state are carried across the swap: changing `src` reloads
 * the element, and a reader who toggles the theme half way through a clip
 * should not be sent back to the start of it.
 */
function themeClips() {
  const want = theme();
  for (const v of document.querySelectorAll('video[data-light]')) {
    const src = v.dataset[want] || v.dataset.light;
    if (!src || v.getAttribute('src') === src) continue;
    const at = v.currentTime;
    const playing = !v.paused && !v.ended;
    v.closest('.mount')?.classList.remove('ready');   // doodle back while the swap loads
    v.setAttribute('src', src);
    // Seeking before the new file has metadata silently does nothing.
    v.addEventListener('loadedmetadata', () => {
      if (at) v.currentTime = Math.min(at, v.duration || at);
      if (playing) v.play().catch(() => { /* a blocked resume is not worth reporting */ });
    }, { once: true });
  }
}

// `loadeddata` means there is a frame to show, which is the moment the doodle
// stops being the answer to "is anything happening". It does not bubble, so
// this listens on the capture phase -- which still reaches the target.
document.addEventListener('loadeddata', (e) => {
  if (e.target.tagName === 'VIDEO') e.target.closest('.mount')?.classList.add('ready');
}, true);

// ui.js's toggle writes data-theme on <html>; with no explicit choice stored,
// the OS preference is what applies, so both have to be watched.
new MutationObserver(themeClips).observe(document.documentElement, {
  attributes: true, attributeFilter: ['data-theme'],
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeClips);

function sizeClips() {
  const rule = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rule')) || 32;
  for (const fig of document.querySelectorAll('.clip')) {
    const rules = Math.max(5, Math.round(fig.clientWidth / 1.6 / rule));
    fig.style.setProperty('--clip-rules', rules);
  }

  // Centre the step text against the clip beside it -- but in whole rules.
  //
  // This is the reason it is not `align-items: center`. A clip fifteen rules
  // tall next to four rules of text leaves eleven rules over, and CSS would
  // split that into five and a half, putting every line of that paragraph
  // 16px off the ruled lines. Rounding to a rule first costs at most half a
  // line of asymmetry and keeps the writing on the paper.
  //
  // Read in a second pass so the clip heights set above have been applied.
  const stacked = matchMedia('(max-width: 62rem)').matches;
  for (const step of document.querySelectorAll('.step')) {
    const say = step.querySelector('.say');
    const clip = step.querySelector('.clip');
    if (!say) continue;
    say.style.paddingTop = '0px';
    if (stacked || !clip) continue;
    const over = clip.offsetHeight - say.offsetHeight;
    if (over > rule) say.style.paddingTop = `${Math.round(over / 2 / rule) * rule}px`;
  }
}

function select(name, { push = true } = {}) {
  if (!TABS[name]) name = 'student';
  for (const [key] of Object.entries(TABS)) {
    const on = key === name;
    $('tab-' + key).setAttribute('aria-selected', String(on));
    $('tab-' + key).classList.toggle('on', on);
    $('panel-' + key).hidden = !on;
  }
  // Pausing on the way out matters: a clip left playing in a hidden panel keeps
  // going, and the sound of a video you cannot see is the classic version of
  // this bug. These are muted, but it still burns battery on a phone.
  for (const v of document.querySelectorAll('.panel[hidden] video')) v.pause();
  if (push && location.hash !== '#' + name) history.replaceState({}, '', '#' + name);
  sizeClips();
}

$('main').addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { select(tab.dataset.tab); return; }

});

// Left/right through the tab strip, which is what a tablist is expected to do.
$('main').addEventListener('keydown', (e) => {
  if (!e.target.closest('[data-tab]')) return;
  const keys = Object.keys(TABS);
  const at = keys.indexOf(e.target.dataset.tab);
  const to = e.key === 'ArrowRight' ? at + 1 : e.key === 'ArrowLeft' ? at - 1 : -1;
  if (to < 0 || to >= keys.length) return;
  e.preventDefault();
  select(keys[to]);
  $('tab-' + keys[to]).focus();
});

addEventListener('resize', sizeClips);

(async function load() {
  const names = [...new Set(Object.values(TABS).flat())];
  const manifests = {};
  const missing = [];

  await Promise.all(names.map(async (name) => {
    try {
      const res = await fetch(`/how/steps/${name}.json`);
      if (!res.ok) throw new Error(String(res.status));
      manifests[name] = await res.json();
    } catch {
      missing.push(name);
    }
  }));

  for (const [tab, parts] of Object.entries(TABS)) {
    const have = parts.map((p) => manifests[p]).filter(Boolean);
    $('panel-' + tab).innerHTML = have.length
      ? have.map(sectionHtml).join('')
      : '<p class="muted">These steps have not been written yet.</p>';
  }

  if (missing.length) {
    const m = $('msg');
    m.hidden = false;
    m.className = 'notice error';
    m.textContent = `Some steps could not be loaded (${missing.join(', ')}). `
      + 'Re-run the recorder for those to rebuild them.';
  }

  themeClips();
  select((location.hash || '').slice(1));
})();
</script>
</body>
</html>
