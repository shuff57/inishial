<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who has signed · iniSHial</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- The stored theme, applied before the first paint. Inline and tiny on
     purpose: a blocking <script src> here cost ~88ms of first paint, and a
     cross-document view transition cannot start until the new page paints,
     so that delay was visible as a pause-then-flash on every page turn. -->
<script>try{var t=localStorage.getItem("inishial:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="/ui.js" defer></script>
<style>
  main { max-width: 62rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  /* No borders. The paper already draws a line under every row, and a 1px
     border landed a few pixels above it -- two nearly-parallel rules per row,
     which read as a printing fault rather than a table. Line height is a full
     rule now that there is nothing to make room for; the old -1px existed only
     for the border, and leaving it walks every row further off the grid down
     the page. Same change as the Classes table. */
  th, td { text-align: left; padding: 0 .55rem; line-height: var(--rule); vertical-align: top; }
  th { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-stone); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* On a phone the roster stops being a ledger and becomes a list. Six columns
     have a min-content width no viewport can shrink, so at 390px the page
     scrolled sideways and the parent email and Signed copy link were off the
     edge. Stacked, each student is name, period and count on one line, the
     status pill, the email, and the link -- all still a whole number of rules.
     The headings survive as data-label; without them a bare "6" and "3/4"
     under a name mean nothing. */
  @media (max-width: 44rem) {
    table, tbody, tr, td { display: block; width: auto; }
    thead { display: none; }
    tbody tr { margin-bottom: var(--rule); }
    td { padding: 0; }
    td.name { font-weight: 600; }
    /* vertical-align:top, never baseline -- a smaller label aligned by its own
       baseline grows the line box past one rule and the column below drifts. */
    td[data-label] {
      display: inline-block; vertical-align: top;
      text-align: left; line-height: var(--rule); margin-right: 1rem;
    }
    td[data-label]::before {
      content: attr(data-label) " ";
      color: var(--ink-stone); font-size: .78rem;
      text-transform: uppercase; letter-spacing: .05em;
    }
    td:empty { display: none; }
  }
  .pill { display: inline-block; font-size: .74rem; font-weight: 700; padding: .12rem .5rem; border-radius: 9999px; white-space: nowrap; }
  .pill.complete { background: var(--tab-1); color: #10352a; }
  .pill.partial { background: var(--tab-5); color: #4a3a10; }
  .pill.stale { background: var(--tab-2); color: #2f2450; }

  /* The amendment panel. Closed by default: on most visits nothing has been
     amended and this is not what the page is for. A whole rule of margin so
     opening it does not walk the table below off the ruled paper. */
  .notify { margin: var(--rule) 0; }
  .notify > summary {
    cursor: pointer; line-height: var(--rule);
    font-weight: 600; color: var(--ink);
  }
  .notify textarea { min-height: calc(var(--rule) * 4); }
  #notifyAddresses { min-height: calc(var(--rule) * 2); }
  .pill.not_started, .pill.no_code { background: var(--sand); color: var(--ink-olive); }
  .pill.not_registered { background: var(--tab-3); color: #5a1f2c; }
  /* row-gap: 0 -- a wrapping row spends its `gap` vertically as well, and seven
     status chips wrap on any narrow window. See the note on .book-bar in
     app.css. Each chip is exactly one rule, so the wrapped rows still land on
     the ruling and the roster table below them stays on the grid. */
  .filters { display: flex; column-gap: .4rem; row-gap: 0; flex-wrap: wrap; margin: var(--rule) 0; }
  .filters button { min-height: 0; height: var(--rule); line-height: calc(var(--rule) - 2px); padding: 0 .7rem; background: transparent; color: var(--ink-stone); border-color: var(--border-warm); font-size: .8rem; }
  .filters button[aria-pressed=true] { background: var(--mark); color: var(--ink); border-color: var(--mark-deep); }

  /* A strip of tape under the pointer, the way the editor's toolbar row works.
   *
   * These read as plain words at rest, which is the complaint: the outline set
   * above never appeared, because `.filters button` is (0,1,1) and the tape
   * rule -- `main :is(button, .button):not(.danger)` at (0,2,1) -- sets both
   * background and border-color to transparent. The border was being painted
   * over by a rule that exists to stop these being taped at all.
   *
   * So rather than fight it into being an outline, let it be what the rest of
   * the app already does for one-rule controls: nothing at rest, a torn strip
   * on hover and on focus. `.filters` sits on app.css's opt-out list, so the
   * ::before has to be handed back explicitly, and `:not(.danger)` is what
   * carries this to (0,2,3) so it outranks the (0,2,2) that cancelled it. */
  /* `main` and `:not(.danger)` again, and for the custom properties too: the
     tape rule sets `--tape-rest: 1` at (0,2,1), so a plain `.filters button`
     does not merely fail to style the strip -- it fails to turn it OFF, and
     every chip wore a permanent piece of tape. */
  main .filters button:not(.danger) { --tape-rest: 0; --tape-inset: .7rem; }
  main .filters button:not(.danger)::before { content: ''; }
  /* The chosen one is already marked. Tape on top of the marker would say the
     same thing twice, in two languages. */
  main .filters button[aria-pressed=true]:not(.danger)::before { content: none; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); gap: .7rem; margin: var(--rule) 0; }
  .stat { border: 1px solid var(--border-warm); border-radius: var(--radius-sm); padding: .6rem .7rem; background: var(--ivory); }
  .stat b { display: block; font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .74rem; color: var(--ink-stone); text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the page</a>
<header class="site"><nav aria-label="Main">
  <a class="brand" href="/admin/">ini<span class="sh">SH</span>ial</a>
  <ul class="nav-main">
    <li><a class="to-icon" href="/admin/" title="Classes"><svg class="icon only" aria-hidden="true"><use href="/icons.svg#i-desk"/></svg><span class="label">Classes</span></a></li>
    <li><a class="to-icon" href="/admin/editor/" data-keep-course title="Syllabus editor"><svg class="icon only" aria-hidden="true"><use href="/icons.svg#i-pencil"/></svg><span class="label">Syllabus editor</span></a></li>
    <li><a class="to-icon" href="/admin/progress/" data-keep-course title="Who has signed"><svg class="icon only" aria-hidden="true"><use href="/icons.svg#i-signed"/></svg><span class="label">Who has signed</span></a></li>
  </ul>
  <div class="nav-end">
    
    <button type="button" class="secondary to-icon" id="navSignout" title="Sign out"><svg class="icon only" aria-hidden="true"><use href="/icons.svg#i-signout"/></svg><span class="label">Sign out</span></button>
  </div>
</nav></header>

<main id="main" tabindex="-1">
  <h1 id="title">Who has signed</h1>
  <p class="muted small" id="sub"></p>
  <div id="msg" hidden></div>

  <div class="summary" id="summary"></div>

  <!--
    After an amendment: who still owes initials on the new version, and the
    two things you need to go and ask them.

    The app does not send this. It has never sent mail -- access codes go out
    the same way, as a CSV you mail-merge -- and adding a sender would mean a
    provider account, an API key and DNS records for a message that lands in
    more inboxes coming from a school address than from a service nobody at
    the school recognises. So it writes the message and hands you the list.

    Hidden unless there is a previous version AND somebody is behind on it.
  -->
  <details id="notify" class="notify" hidden>
    <summary id="notifySummary"></summary>
    <p class="muted small" id="notifyWhat"></p>

    <p class="row">
      <button class="secondary" id="copyTo">Copy addresses</button>
      <button class="secondary" id="copyMsg">Copy message</button>
      <a id="notifyCsv" class="button secondary" href="#">Download CSV</a>
    </p>

    <label for="notifyAddresses">Addresses
      <span class="hint">Everyone still owing initials on this version who has an address on file. Paste into Bcc.</span></label>
    <textarea id="notifyAddresses" readonly spellcheck="false"></textarea>

    <label for="notifyBody">Message
      <span class="hint">Edit it before you send if you want. Copying takes whatever is in the box.</span></label>
    <textarea id="notifyBody" spellcheck="false"></textarea>

    <p class="small muted" id="notifyNoEmail" hidden></p>
  </details>

  <div class="filters on-rules" id="filters">
    <button data-f="all" aria-pressed="true">Everyone</button>
    <button data-f="outstanding" aria-pressed="false">Still outstanding</button>
    <button data-f="not_registered" aria-pressed="false">Not registered</button>
    <button data-f="stale" aria-pressed="false">Signed an older version</button>
    <button data-f="complete" aria-pressed="false">Complete</button>
  </div>

  <p class="row">
    <!-- Links styled as buttons. A <button> nested in an <a> is invalid HTML
         and announces inconsistently; these navigate, so they stay links. -->
    <a id="csv" class="button secondary" href="#">Download CSV</a>
    <a id="creds" class="button secondary" href="#">Access codes</a>
    <a id="edit" class="button secondary" href="#">Edit syllabus</a>
  </p>

  <table>
    <thead><tr>
      <th>Student</th><th>Per.</th><th>Status</th><th class="num">Initialed</th><th>Parent email</th><th></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="empty" class="muted small" hidden>Nobody matches that filter.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const courseId = Number(new URLSearchParams(location.search).get('course_id'));
let data = null;
let filter = 'all';

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function notice(text, kind) { const m = $('msg'); m.hidden = false; m.className = 'notice ' + kind; m.textContent = text; }

// "Outstanding" is the working list: anyone you would actually chase. Complete
// students are not on it, and neither is anyone whose signature is still valid.
const OUTSTANDING = new Set(['not_registered', 'no_code', 'not_started', 'partial', 'stale']);

function matches(s) {
  if (filter === 'all') return true;
  if (filter === 'outstanding') return OUTSTANDING.has(s.status);
  return s.status === filter;
}

function render() {
  const shown = data.students.filter(matches);
  $('rows').innerHTML = shown.map((s) => `<tr>
      <td class="name">${esc(s.student)}<br><span class="muted" style="font-size:.8rem">${esc(s.student_ext_id)}</span></td>
      <td data-label="Per.">${esc(s.period ?? '')}</td>
      <td><span class="pill ${s.status}">${esc(s.status_label)}</span></td>
      <td class="num" data-label="Initialed">${s.required ? `${s.parent_signed}/${s.required}` : '—'}</td>
      <td class="small">${esc(s.email ?? '—')}</td>
      <td>${s.account_id && s.parent_signed
        ? `<a href="/admin/signed?account_id=${s.account_id}" target="_blank">Signed copy</a>` : ''}</td>
    </tr>`).join('');
  $('empty').hidden = shown.length > 0;
}

for (const btn of $('filters').querySelectorAll('button')) {
  btn.addEventListener('click', () => {
    filter = btn.dataset.f;
    for (const b of $('filters').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b === btn));
    render();
  });
}

(async function load() {
  if (!courseId) { notice('No class chosen. Open this from the admin page.', 'error'); return; }
  const res = await fetch(`/api/admin/progress?course_id=${courseId}`);
  if (res.status === 401) { location.href = '/admin/login/?next=' + encodeURIComponent(location.pathname + location.search); return; }
  data = await res.json();
  if (!res.ok) { notice(data.error || 'Could not load.', 'error'); return; }

  $('title').textContent = data.course.name;
  $('sub').textContent = data.published
    ? `Version ${data.published.num} is live · ${data.published.required} sections require initials · ${data.total} active students`
    : `No syllabus published yet · ${data.total} active students`;

  $('csv').href = `/api/admin/progress?course_id=${courseId}&format=csv`;
  // A page to read, not a file to download. The CSV is still there for a
  // mail merge, one click further in.
  $('creds').href = `/admin/codes/?course_id=${courseId}`;
  $('edit').href = `/admin/editor/?course_id=${courseId}`;

  const c = data.counts;
  const outstanding = [...OUTSTANDING].reduce((n, k) => n + (c[k] ?? 0), 0);
  $('summary').innerHTML =
      `<div class="stat"><b>${c.complete ?? 0}</b><span>complete</span></div>`
    + `<div class="stat"><b>${outstanding}</b><span>outstanding</span></div>`
    + `<div class="stat"><b>${c.not_registered ?? 0}</b><span>not registered</span></div>`
    + `<div class="stat"><b>${c.stale ?? 0}</b><span>older version</span></div>`;

  if (!data.published) notice('No syllabus is published for this class yet, so nobody can sign. Publish one first.', 'error');
  buildNotify();
  render();
})();

/**
 * The amendment panel.
 *
 * Built from what is already on the page: `amendment` says which version
 * replaced which and which sections moved, and the student list already
 * carries every address and status. Nothing is fetched twice.
 */
function buildNotify() {
  const a = data.amendment;
  if (!a) return;                       // a first publish is not an amendment

  // Who is actually behind. `complete` families have nothing to read, and a
  // family with no address on file cannot be mailed -- counted, so the number
  // in the summary and the number of addresses agree or say why they do not.
  const behind = data.students.filter((s) => s.status !== 'complete' && s.account_id);
  if (!behind.length) return;

  const withEmail = behind.filter((s) => s.email);
  const missing = behind.length - withEmail.length;

  $('notify').hidden = false;
  $('notifySummary').textContent =
    `Tell families about version ${a.version} (${behind.length} of ${data.total} still to initial)`;

  const what = a.changed_sections.length
    ? `Changed since version ${a.previous_version}: ${a.changed_sections.join(', ')}.`
    : `Version ${a.previous_version} was replaced by version ${a.version}.`;
  $('notifyWhat').textContent = what;

  // Semicolons: Outlook's separator, and Gmail accepts them too. One line, so
  // a paste into Bcc lands as one field rather than as a column.
  $('notifyAddresses').value = withEmail.map((s) => s.email).join('; ');
  $('notifyNoEmail').hidden = missing === 0;
  if (missing) {
    $('notifyNoEmail').textContent = missing === 1
      ? '1 family has no address on file and is not in this list. They are in the table above, and the CSV.'
      : `${missing} families have no address on file and are not in this list. They are in the table above, and the CSV.`;
  }

  // One section or several changes three sentences, so the count is worked out
  // once and the wording follows it. A message that says "one section" over a
  // list of three is the kind of thing a parent notices and stops trusting.
  const n = a.changed_sections.length;
  const one = n === 1;
  const sections = n
    ? (one ? `The ${a.changed_sections[0]} section has changed.`
      : `These sections have changed: ${a.changed_sections.join(', ')}.`)
    : 'Part of the syllabus has changed.';

  // Says what changed, what is being asked, and that the rest still stands --
  // the last part matters, because "sign the syllabus again" is what a parent
  // will otherwise assume and is the reason they will not do it.
  $('notifyBody').value = [
    `Subject: ${data.course.name} syllabus — updated, please initial ${one ? 'one section' : 'the updated sections'}`,
    '',
    'Hello,',
    '',
    `The ${data.course.name} syllabus has been updated. ${sections}`,
    '',
    `Please sign in at ${location.origin}/sign/ with your student's ID number and`,
    `your access code. ${one ? 'The section that changed is' : 'The sections that changed are'} marked`,
    `"Updated since you signed" and ${one ? 'is the only one' : 'are the only ones'} needing your initials`,
    'again — everything you have already signed still stands.',
    '',
    'Thank you,',
  ].join('\n');

  $('notifyCsv').href = `/api/admin/progress?course_id=${courseId}&format=csv`;

  // Copy, with the selection left behind as the fallback. navigator.clipboard
  // needs a secure context, and this page is reachable over plain http on a
  // school network -- so when the API is missing or refused, the text ends up
  // selected and Ctrl+C finishes the job rather than the button doing nothing.
  const copy = (id, btn) => async () => {
    const el = $(id);
    el.select();
    const done = (ok) => {
      btn.textContent = ok ? 'Copied' : 'Press Ctrl+C';
      setTimeout(() => { btn.textContent = btn.dataset.label; }, 2000);
    };
    try {
      await navigator.clipboard.writeText(el.value);
      done(true);
    } catch {
      done(false);
    }
  };
  for (const [id, btn] of [['notifyAddresses', $('copyTo')], ['notifyBody', $('copyMsg')]]) {
    btn.dataset.label = btn.textContent;
    btn.addEventListener('click', copy(id, btn));
  }
}
</script>

<!-- Light/dark toggle, in the corner rather than the nav, matching the
     student side. The nav is already carrying the class links and the
     sign-out control; this is a preference, not navigation. -->
<button type="button" class="theme-toggle"><svg class="sun icon" aria-hidden="true"><use href="/icons.svg#i-sun"/></svg><svg class="moon icon" aria-hidden="true"><use href="/icons.svg#i-moon"/></svg></button>

<!-- Buy Me a Coffee. The teacher is who the ask is aimed at, so it belongs
     on this side too. Behaviour and the height cap live in /bmc.js. -->
<script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="shuff57" data-description="Support me on Buy me a coffee!" data-message="" data-color="#FFE08A" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
<script src="/bmc.js" defer></script>
</body>
</html>
