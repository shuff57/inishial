<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · iniSHial</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- The stored theme, applied before the first paint. Inline and tiny on
     purpose: a blocking <script src> here cost ~88ms of first paint, and a
     cross-document view transition cannot start until the new page paints,
     so that delay was visible as a pause-then-flash on every page turn. -->
<script>try{var t=localStorage.getItem("inishial:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="/ui.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to the page</a>
<header class="site"><nav aria-label="Main">
  <a class="brand" href="/">ini<span class="sh">SH</span>ial</a>
  <ul class="nav-main">
    <li><a class="to-icon" href="/admin/login/" title="Teacher sign-in"><svg class="icon only" aria-hidden="true"><use href="/icons.svg#i-signin"/></svg><span class="label">Teacher sign-in</span></a></li>
    <li><a class="to-icon" href="/admin/signup/" title="Set up a teacher account"><svg class="icon only" aria-hidden="true"><use href="/icons.svg#i-person-plus"/></svg><span class="label">Set up a teacher account</span></a></li>
  </ul>
  <div class="nav-end">
    
    <a class="to-icon" href="/" title="Back to the student side"><svg class="icon only" aria-hidden="true"><use href="/icons.svg#i-home"/></svg><span class="label">Back to the student side</span></a>
  </div>
</nav></header>

<main id="main" tabindex="-1">
  <h1>Teacher sign-in</h1>
  <p class="muted small">This is the admin side: rosters, the syllabus editor, and signing records.
    Parents and students don't sign in here.</p>

  <form id="form" class="card plain" novalidate>
    <label for="email">School email address
      <span class="hint">Leave blank if you're using the shared admin password.</span></label>
    <input id="email" name="email" type="email" autocomplete="email" autofocus>

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <div id="msg" hidden></div>
    <p><button id="submit" type="submit">Sign in</button></p>
  </form>

  <p class="small muted" id="signupLine" hidden>
    No account yet? <a href="/admin/signup/">Set one up</a> with your school email address.
  </p>
</main>

<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const submit = document.getElementById('submit');

// Where to land after signing in. Only same-origin paths are honoured, so a
// crafted ?next= cannot bounce a signed-in teacher to another site.
function nextPath() {
  const raw = new URLSearchParams(location.search).get('next') || '/admin/';
  return /^\/(?!\/)/.test(raw) ? raw : '/admin/';
}

// Only offer sign-up when the server actually has a domain allowlist. A link to
// a form that can only refuse you is worse than no link.
fetch('/api/admin/signup')
  .then((r) => r.json())
  .then((b) => { document.getElementById('signupLine').hidden = !b.available; })
  .catch(() => {});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  msg.hidden = true;
  submit.disabled = true;
  submit.textContent = 'Checking…';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // An empty email means the shared admin password, which is a different
      // credential entirely -- so it is omitted rather than sent blank.
      body: JSON.stringify({
        email: document.getElementById('email').value.trim() || undefined,
        password: document.getElementById('password').value,
      }),
    });
    const body = await res.json();
    if (!res.ok) {
      msg.hidden = false;
      msg.className = 'notice error';
      msg.textContent = body.error || 'Could not sign in.';
      return;
    }
    location.href = nextPath();
  } catch {
    msg.hidden = false;
    msg.className = 'notice error';
    msg.textContent = 'Could not reach the server.';
  } finally {
    submit.disabled = false;
    submit.textContent = 'Sign in';
  }
});
</script>

<!-- Light/dark toggle, in the corner rather than the nav, matching the
     student side. The nav is already carrying the class links and the
     sign-out control; this is a preference, not navigation. -->
<button type="button" class="theme-toggle theme-fab"><svg class="sun icon" aria-hidden="true"><use href="/icons.svg#i-sun"/></svg><svg class="moon icon" aria-hidden="true"><use href="/icons.svg#i-moon"/></svg></button>

<!-- Buy Me a Coffee. The teacher is who the ask is aimed at, so it belongs
     on this side too. Behaviour and the height cap live in /bmc.js. -->
<script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="shuff57" data-description="Support me on Buy me a coffee!" data-message="" data-color="#FFE08A" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
<script src="/bmc.js" defer></script>
</body>
</html>
