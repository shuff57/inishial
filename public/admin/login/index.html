<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · iniSHial</title>
<link rel="stylesheet" href="/app.css">
<script src="/ui.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to the page</a>
<header class="site"><nav aria-label="Main">
  <a class="brand" href="/">ini<span class="sh">SH</span>ial</a>
  <ul class="nav-main">
    <li><a href="/admin/login/">Teacher sign-in</a></li>
  </ul>
  <div class="nav-end">
    <button type="button" class="theme-toggle"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.2v2.1M12 19.7v2.1M4.6 4.6l1.5 1.5M17.9 17.9l1.5 1.5M2.2 12h2.1M19.7 12h2.1M4.6 19.4l1.5-1.5M17.9 6.1l1.5-1.5"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.8A8.8 8.8 0 0 1 9.2 3.5a8.8 8.8 0 1 0 11.3 11.3Z"/></svg></button>
    <a href="/">Back to the student side</a>
  </div>
</nav></header>

<main id="main" tabindex="-1">
  <h1>Teacher sign-in</h1>
  <p class="muted small">This is the admin side — rosters, the syllabus editor, and signing records.
    Parents and students don't sign in here.</p>

  <form id="form" class="card plain" novalidate>
    <label for="password">Admin password</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus>
    <div id="msg" hidden></div>
    <p><button id="submit" type="submit">Sign in</button></p>
  </form>

  <p class="small muted">Sessions last two hours. Five wrong attempts locks sign-in for thirty minutes.</p>
</main>

<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const submit = document.getElementById('submit');

// Where to land after signing in. Only same-origin paths are honoured, so a
// crafted ?next= cannot bounce a signed-in teacher to another site.
function nextPath() {
  const raw = new URLSearchParams(location.search).get('next') || '/admin/';
  return /^\/(?!\/)/.test(raw) ? raw : '/admin/';
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  msg.hidden = true;
  submit.disabled = true;
  submit.textContent = 'Checking…';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value }),
    });
    const body = await res.json();
    if (!res.ok) {
      msg.hidden = false;
      msg.className = 'notice error';
      msg.textContent = body.error || 'Could not sign in.';
      return;
    }
    location.href = nextPath();
  } catch {
    msg.hidden = false;
    msg.className = 'notice error';
    msg.textContent = 'Could not reach the server.';
  } finally {
    submit.disabled = false;
    submit.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
