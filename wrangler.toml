# Cloudflare Pages config for iniSHial.
#
# Cloudflare project and D1 names must be lowercase, so the platform-facing
# name is `inishial` even though the app is branded iniSHial.
#
# Separate D1 database from bookshelf on purpose: this one holds student PII
# (names, student IDs, parent email addresses) and should not share a blast
# radius with the public bookshelf app.
#
# First-time setup:
#   npx wrangler d1 create inishial          # paste the id below
#   npm run db:local                          # apply schema locally
#   npm run db:remote                         # apply schema in production
#
# Then, in the dashboard, put a Cloudflare Access application in front of
# /api/admin/* and /admin/* — the Functions fail closed without it, but failing
# closed is not the same as being protected.

name = "inishial"
pages_build_output_dir = "public"
compatibility_date = "2026-07-27"

[[d1_databases]]
binding = "DB"
database_name = "inishial"
database_id = "26a2ff24-a632-4b74-9034-3b40622b15fa"

[vars]
# Comma-separated allowlist, checked on top of the Access policy. Leave empty
# to accept any identity Access lets through.
ADMIN_EMAILS = ""
# Comma-separated list of the school's email domains. A teacher may create their
# own account at /admin/signup/ only if their address ends in one of these.
#
# Leave empty to switch self-service sign-up off entirely -- an empty list is
# read as "nobody", never as "anybody". Write `school.org` for that domain
# exactly, or `.school.org` to accept its subdomains too.
#
# EMPTY MEANS OPEN: anyone who finds the site can create a teacher account.
# Set it to a domain to restrict sign-up to that school instead.
#
# This is not identity verification either way: nothing emails the address, so
# a domain narrows who can sign up rather than proving who they are. What still
# holds regardless is that each account sees only its own courses.
TEACHER_DOMAINS = ""
# Ollama host for the authoring-time AI pass. Secret set out of band:
#   npx wrangler pages secret put OLLAMA_API_KEY --project-name inishial
OLLAMA_HOST = "https://ollama.com"
# Where the parent access-code email points. `/sign` is appended. Kept as a
# var so moving between hostnames is one edit here --
# a mail whose link points at a different registrable domain than its From
# address is worse for the parent and a signal spam filters score against.
# The site and the mail now share lefthanddev.com. (inishial.huffpalmer.fyi is
# still attached to the Pages project so links in mail sent before the move
# keep working.)
APP_URL = "https://inishial.lefthanddev.com"
# Outbound mail goes through Gmail over SMTP, the same way raSHio sends
# (functions/_lib/smtp.js). Gmail sends as the account that signs in, so
# SMTP_USERNAME is also the From address. Use a Gmail account of its own, apart
# from raSHio's: this app mails student codes and parent addresses.
SMTP_HOSTNAME = "smtp.gmail.com"
SMTP_PORT = "587"
SMTP_FROM_NAME = "iniSHial"
SMTP_USERNAME = ""   # TODO: the Gmail address that sends. Empty means "not configured" and mail fails honestly.
# Where a parent's reply lands. Not the From address: Gmail cannot send as a
# lefthanddev.com address without failing that domain's DMARC reject policy, but
# a Reply-To is just a header, so replies reach a mailbox a human reads.
MAIL_REPLY_TO = "inishial-support@lefthanddev.com"
# When set, functions/_lib/mail.js logs the rendered email to the console
# instead of sending it. Dev without secrets configured.
# Leave unset in production.
MAIL_DRY_RUN = "1"
# The Gmail App Password for SMTP_USERNAME (needs 2-step verification on the
# account). Set out of band via:
#   npx wrangler pages secret put SMTP_PASSWORD --project-name inishial
# Which model answers Fix headings and Suggest initials when a teacher has not
# picked one. Measured on the real prompt, five runs each: minimax-m3 averaged
# 3.0s and got the answer right every time, against 5.2s for gpt-oss:120b,
# which is the built-in fallback. A teacher clicks this and waits.
OLLAMA_MODEL = "minimax-m3"
# Models the host lists but this plan cannot run. kimi-k3 answers every request
# with `402 this model uses extra usage only (not included in plan)`, so
# offering it is offering a button that fails after you have waited for it.
# A fact about the subscription, not about the software -- hence config.
OLLAMA_HIDE = "kimi-k3"

[[env.production.d1_databases]]
binding = "DB"
database_name = "inishial"
database_id = "26a2ff24-a632-4b74-9034-3b40622b15fa"

[env.production.vars]
ADMIN_EMAILS = ""
TEACHER_DOMAINS = ""
OLLAMA_HOST = "https://ollama.com"
OLLAMA_MODEL = "minimax-m3"
OLLAMA_HIDE = "kimi-k3"
APP_URL = "https://inishial.lefthanddev.com"
SMTP_HOSTNAME = "smtp.gmail.com"
SMTP_PORT = "587"
SMTP_FROM_NAME = "iniSHial"
SMTP_USERNAME = ""   # TODO: the Gmail address that sends (same as above). Empty = mail fails honestly.
MAIL_REPLY_TO = "inishial-support@lefthanddev.com"
# MAIL_DRY_RUN is deliberately absent here: real email goes out via Gmail.
# SMTP_PASSWORD (the Gmail App Password) is set out of band as a secret.
